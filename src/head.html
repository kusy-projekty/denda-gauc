<!doctype html><html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffcc00"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Denda: Gaučový šampion 🛋️</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;color:#fff}
canvas{display:block}
#scn{position:fixed;top:10px;left:10px;background:#000b;padding:6px 10px;border-radius:10px;font-weight:800;font-size:14px;max-width:calc(100vw - 170px);z-index:5}
#watch{position:fixed;top:8px;right:8px;background:#0b0b0b;border:4px solid #555;border-radius:24px;padding:7px 12px;font-size:13px;line-height:1.35;box-shadow:0 4px 12px #0009;min-width:128px;z-index:5}
#watch .h{font-size:10px;color:#888;letter-spacing:1px;text-align:center}
#watch b{font-size:17px;color:#7CFC8a}#watch b.hot{color:#ff4d5e}
#toast{position:fixed;top:112px;right:8px;max-width:min(330px,82vw);background:#152515;border-left:5px solid #7CFC8a;padding:8px 10px;border-radius:10px;font-size:14px;opacity:0;transform:translateX(40px);transition:.3s;z-index:6;pointer-events:none}
#toast.on{opacity:1;transform:none}
#say{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 14px;border-radius:16px;font-size:16px;width:max-content;max-width:min(560px,92vw);text-align:center;box-shadow:0 4px 0 #0006;display:none;z-index:6;font-weight:600}
#say b{color:#c0392b}
#btns{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 10px;z-index:7}
#btns.side{justify-content:flex-end}
.b{background:#ffcc00;color:#111;border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:900;box-shadow:0 5px 0 #a07800;cursor:pointer;font-family:inherit}
.b:active{transform:translateY(3px);box-shadow:0 2px 0 #a07800}
.b.red{background:#ff4757;color:#fff;box-shadow:0 5px 0 #a0202e}
.b.blue{background:#3fa9f5;color:#fff;box-shadow:0 5px 0 #1d6fa8}
.b.off{opacity:.35;pointer-events:none}
.b.pulse{animation:pu .9s infinite}
@keyframes pu{50%{transform:scale(1.09)}}
#burst{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:8;pointer-events:none}
#burst div{font-size:min(18vw,190px);font-weight:900;color:#ffeb3b;-webkit-text-stroke:5px #d00;text-shadow:0 10px 0 #000;transform:rotate(-12deg);animation:bz .5s}
@keyframes bz{0%{transform:scale(.2) rotate(-40deg)}70%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(1) rotate(-12deg)}}
#ov{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#3a2a10ee,#000e);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:9;padding:16px;overflow:auto}
#ov.hide{display:none}
#ov h1{font-size:clamp(30px,8vw,54px);margin:0 0 6px;color:#ffcc00;text-shadow:0 4px 0 #b33;line-height:1.05}
#ov p{max-width:520px;font-size:16px;color:#ddd;margin:6px 0}
.card{background:#222c;border-radius:14px;padding:12px 16px;max-width:460px;width:100%;margin:10px 0;text-align:left;font-size:15px;line-height:1.65}
.card .t{font-size:20px;font-weight:900;color:#ffcc00;text-align:center;margin-top:6px}
#bar{position:fixed;top:48px;left:10px;width:min(230px,calc(100vw - 170px));height:14px;background:#000a;border-radius:8px;overflow:hidden;display:none;z-index:5}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7CFC8a,#ffcc00,#ff4757)}
#joy{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#fff2;border:3px solid #fff6;display:none;z-index:7;touch-action:none}
#joy i{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:#fffa;pointer-events:none}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:8}
@media (pointer:coarse){.b small{display:none}}
@media (max-width:600px){.b{padding:12px 12px;font-size:15px}#say{font-size:14px}}
</style></head><body>
<div id="scn"></div><div id="bar"><i></i></div>
<div id="watch"><div class="h">⌚ DENDA WATCH</div>❤️ <b id="wTep">68</b> BPM<br>👣 <b id="wKr">25</b> kroků<br>⚖️ <b id="wKg">118</b> kg</div>
<div id="toast"></div><div id="say"></div><div id="btns"></div><div id="joy"><i></i></div><div id="burst"><div></div></div><div id="fade"></div>
<div id="ov"></div>
